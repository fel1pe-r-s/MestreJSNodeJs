name: Deploy HealthThesis to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: https://healththesis.com # Altere para seu dominio

      - name: Deploy to Hostinger via GitHub Integration
        run: echo "Hostinger is configured to pull from this repository automatically. Ensure the 'Auto Deploy' feature is enabled in your Hostinger Panel for this repository."
