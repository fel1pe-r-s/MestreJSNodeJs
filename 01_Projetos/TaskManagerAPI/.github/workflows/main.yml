name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 01_Projetos/TaskManagerAPI/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: 01_Projetos/TaskManagerAPI

      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: 01_Projetos/TaskManagerAPI

      - name: Run Migrations
        run: npx prisma migrate deploy
        working-directory: 01_Projetos/TaskManagerAPI
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5432/taskmanager?schema=public

      - name: Run Unit Tests
        run: npx vitest run src/application/use-cases/
        working-directory: 01_Projetos/TaskManagerAPI

      - name: Run E2E Tests
        run: npx vitest run --config vitest.config.e2e.ts
        working-directory: 01_Projetos/TaskManagerAPI
        env:
          DATABASE_URL: postgresql://docker:docker@localhost:5432/taskmanager?schema=public
          JWT_SECRET: mestrejs-node-secret
